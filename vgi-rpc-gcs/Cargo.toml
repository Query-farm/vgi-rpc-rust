[package]
name = "vgi-rpc-gcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "GCS-backed ExternalStorage for vgi-rpc (pluggable V4 signed URL factory)"
readme = "README.md"
keywords = ["vgi-rpc", "gcs", "arrow", "storage"]
categories = ["network-programming"]

[dependencies]
vgi-rpc = { path = "../vgi-rpc", version = "0.21.1", default-features = false, features = ["http"] }
vgi-rpc-s3 = { path = "../vgi-rpc-s3", version = "0.21.1" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
