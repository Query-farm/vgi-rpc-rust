name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain and browser target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check browser transport
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: >-
          cargo clippy -p vgi-rpc-iroh-browser
          --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Typecheck WHATWG stream wrapper
        run: >-
          npx --yes --package typescript tsc --noEmit --strict
          --target ES2022 --lib ES2022,DOM
          vgi-rpc-iroh-browser/js/index.ts

      - name: Test WHATWG stream wrapper
        run: npx --yes tsx --test vgi-rpc-iroh-browser/js/index.test.ts

  fmt-clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      # The workflow-level `RUSTFLAGS: -D warnings` does not reach rustdoc, so
      # doc warnings (broken intra-doc links, public items linking to private
      # ones) scrolled past green for as long as they existed. RUSTDOCFLAGS is
      # what actually gates them.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      # trybuild creates per-fixture `target/tests/<name>/` sandboxes
      # and tears them down before they finish. The rust-cache post
      # step walks `target/` to fingerprint cache contents and trips on
      # the half-cleaned-up dirs (`ENOENT: target/tests/target`).
      # Removing the parent directory before the post-cache step runs.
      - name: Tidy trybuild sandboxes before cache
        if: always()
        run: rm -rf target/tests

  # Every other job builds --all-features, where each optional dependency is
  # present no matter which feature pulled it in. That makes it structurally
  # impossible to catch a feature that fails to declare the crates its own
  # code uses: `oauth-pkce = []` shipped for months while `auth::pkce` used
  # base64, hmac and rand, and nothing was red. This job is the only place
  # narrow feature sets get compiled.
  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Enumerated from cargo metadata rather than hard-coded, so a feature
      # added later is covered without anyone remembering to list it here.
      - name: Build each vgi-rpc feature in isolation
        run: |
          set -euo pipefail
          echo "::group::--no-default-features"
          cargo build -p vgi-rpc --no-default-features --locked
          echo "::endgroup::"
          feats=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vgi-rpc") | .features | keys[]')
          for f in $feats; do
            echo "::group::--no-default-features --features $f"
            cargo build -p vgi-rpc --no-default-features --features "$f" --locked
            echo "::endgroup::"
          done

      # `--all-targets` under a narrow feature set builds every test, example
      # and bench. Any that needs a non-default feature must declare
      # `required-features` so cargo skips it; without that the target is
      # compiled anyway and fails on items that were configured out.
      - name: Clippy all targets with no default features
        run: cargo clippy -p vgi-rpc --no-default-features --all-targets --locked -- -D warnings

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python client drives the Rust server — the original
          # cross-language wire-compat gate.
          - role: server
            server: rust
          # The Rust vgi-rpc-client drives the Rust server (conformance
          # client-driver + Python shim). Exercises the client across every
          # transport (incl. the POSIX shm side-channel) and the
          # external-location / sticky / 413-externalize / 415-codec /
          # response-cap HTTP feature paths.
          - role: client
            server: rust
          # The Rust client drives the canonical *Python* server — the
          # cross-language client gate. Uses the Python reference
          # serve_conformance_*.py scripts from the vgi-rpc-python repo
          # (storage / sticky / strict / auth), so the client's HTTP features
          # are validated against the reference implementation.
          - role: client
            server: python
    steps:
      - uses: actions/checkout@v5

      - name: Check out vgi-rpc-python conformance suite
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi-rpc-python
          path: vgi-python

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install conformance harness from Python main
        # Coordinated protocol changes must be verifiable before either
        # implementation is published. Using the latest PyPI release here can
        # pair a new Rust protocol with an old Python client and fail before
        # conformance begins.
        # The `conformance` extra pulls jsonschema, which `vgi-rpc-test
        # --access-log` needs to check records against access_log.schema.json.
        # httpx2 2.12.0 on Python 3.13 advertises zstd but leaves the response
        # body encoded, so PyArrow receives the zstd frame and reports a
        # negative IPC continuation token. Keep the last verified decoder
        # until that upstream regression is fixed.
        run: |
          python -m pip install --upgrade pip
          pip install -e "./vgi-python[http,cli,external,conformance]" pytest pytest-timeout httpx "httpx2==2.9.1"

      - name: Build conformance worker (+ client-driver for the client role)
        run: |
          if [ "${{ matrix.server }}" = "rust" ]; then
            cargo build -p vgi-rpc-conformance-rust --locked
            ln -sf target/debug/vgi-rpc-conformance-rust conformance-worker-rust
          fi
          if [ "${{ matrix.role }}" = "client" ]; then
            cargo build -p vgi-rpc-conformance-client-driver --locked
          fi

      - name: Run conformance suite (role=${{ matrix.role }}, server=${{ matrix.server }})
        # Full transport matrix — matches `scripts/conf.py run --transport all`.
        # `shm_pipe` exercises the POSIX shared-memory side-channel and
        # `http_externalize_always` the external-location upload/fetch path;
        # under role=client both flow through the Rust client.
        env:
          VGI_CONFORMANCE_ROLE: ${{ matrix.role }}
          VGI_CONFORMANCE_SERVER: ${{ matrix.server }}
          VGI_TRANSPORTS: pipe,subprocess,http,unix,tcp,http_externalize_always,shm_pipe
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/target/debug/vgi-rpc-conformance-client-driver
        run: |
          if [ "${{ matrix.server }}" = "python" ]; then
            export RUST_CONFORMANCE_WORKER="$(command -v vgi-rpc-conformance)"
            export VGI_PYTHON_BIN="$(command -v python)"
            export VGI_PY_TESTS_DIR="${{ github.workspace }}/vgi-python/tests"
          else
            export RUST_CONFORMANCE_WORKER="${{ github.workspace }}/conformance-worker-rust"
          fi
          python -m pytest test_rust_conformance.py --timeout=20 --timeout-method=signal -v

      - name: Verify native Rust client typed serialization against Python
        if: matrix.role == 'client' && matrix.server == 'python'
        env:
          VGI_RPC_PYTHON: python
        run: >-
          cargo test -p vgi-rpc-client --test python_native_client
          -- --ignored --nocapture

      # Access-log conformance was verified by hand for months and drifted
      # anyway — four people checked it by inspection and the rule was still
      # wrong. It runs here now so it cannot silently rot again.
      #
      # --access-log-debug is not optional: at INFO the worker omits
      # `request_data`, and a log that never carries the field trivially
      # satisfies every rule that governs it, so the whole payload contract
      # goes unchecked. --require-request-data makes that absence a failure.
      #
      # The runner-driven suite with no access log attached. This is where the
      # `large_payload` group runs, including the >2 GiB
      # `echo_binary_over_int32_max` that vgi-rpc 0.42.0 made required — the
      # pytest step above carries no such tests, so the category is reachable
      # only through `vgi-rpc-test`. The budget is 600s against the
      # reference's own 300s for that one test: moving 2 GiB there and back on
      # a shared runner takes tens of seconds even when nothing is wrong, and
      # it must fail on wrong bytes, never on the stopwatch.
      - name: Run conformance suite (large payloads included)
        if: matrix.role == 'server' && matrix.server == 'rust'
        run: timeout 600 vgi-rpc-test --cmd "${{ github.workspace }}/conformance-worker-rust"

      # Access-log conformance was verified by hand for months and drifted
      # anyway — four people checked it by inspection and the rule was still
      # wrong. It runs here now so it cannot silently rot again.
      #
      # --access-log-debug is not optional: at INFO the worker omits
      # `request_data`, and a log that never carries the field trivially
      # satisfies every rule that governs it, so the whole payload contract
      # goes unchecked. --require-request-data makes that absence a failure.
      #
      # `large_payload` is excluded here, and only here. At --access-log-debug
      # a record embeds the whole request payload, so both tests in that group
      # overshoot the emitter's per-record cap; it sheds `request_data` and
      # marks the record truncated, exactly as access-log-spec §5b prescribes,
      # and --require-request-data then reports those records as missing the
      # field. The >2 GiB one is worse than that — a multi-gigabyte JSONL line
      # to write and schema-validate, which killed the worker outright and
      # broke every test after it. The group still runs, in the step above.
      # This step's job is the log's *shape*, which the ordinary payloads
      # exercise just as well.
      #
      # Nothing else is filtered: the suite's zero-parameter methods (void*)
      # send an empty schema and no row, and they are the exact case a
      # row-demanding validator gets wrong (v0.36.1 shipped that bug). Do not
      # add a filter that excludes them.
      - name: Verify access log against the spec
        if: matrix.role == 'server' && matrix.server == 'rust'
        run: |
          timeout 300 vgi-rpc-test \
            --cmd "${{ github.workspace }}/conformance-worker-rust --access-log $RUNNER_TEMP/access-log.jsonl --access-log-debug" \
            --access-log "$RUNNER_TEMP/access-log.jsonl" \
            --require-request-data \
            --filter '!large_payload'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV toolchain (1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Build on MSRV
        run: cargo build --workspace --all-features --locked
