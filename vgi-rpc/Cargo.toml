[package]
name = "vgi-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Transport-agnostic RPC framework built on Apache Arrow IPC"
readme = "README.md"
keywords = ["rpc", "arrow", "ipc", "streaming", "http"]
categories = ["network-programming", "web-programming::http-server", "data-structures"]

[features]
default = ["http", "macros"]
macros = ["dep:vgi-rpc-macros"]
# External-location batches (upload/resolve). Pulls only zstd — no server
# (axum/tokio) stack — so a client can reuse `external` without `http`.
external = ["dep:zstd"]
# Streaming-state bincode codec (serde + bincode only — no server stack). Used by
# the core dispatch path, so it must be enableable without `http` (keeps the crate
# wasm-buildable). `http` re-includes it.
stream-codec = ["dep:bincode"]
# Generic XChaCha20-Poly1305 seal/open envelope (`crypto`). AEAD + RNG + base64
# only — no server stack. Downstream crates seal their own tokens with it (the
# `vgi` worker framework's split tokens are not an HTTP concern), so like
# `stream-codec` it must be enableable without `http` to keep those crates
# wasm-buildable. `http` re-includes it for the sticky streaming-state token.
crypto = ["dep:base64", "dep:chacha20poly1305", "dep:rand"]
http = ["external", "stream-codec", "crypto", "dep:axum", "dep:tower-http", "dep:tokio", "dep:hmac", "dep:base64", "dep:rand", "dep:bincode", "dep:chacha20poly1305", "dep:flate2"]
jwt = []
jwt-jsonwebtoken = ["jwt", "dep:jsonwebtoken", "dep:reqwest"]
# `auth::pkce` needs base64 (URL-safe challenge/cookie encoding), hmac (state
# cookie signature) and rand (verifier/nonce entropy). They must be declared
# here, not inherited from `http`: `oauth-pkce` is usable standalone (a client
# doing the browser flow without the server stack), and CI's --all-features
# build masked the missing deps until the narrow-feature matrix was added.
oauth-pkce = ["dep:base64", "dep:hmac", "dep:rand"]
oauth-pkce-server = ["oauth-pkce", "http", "dep:reqwest", "dep:urlencoding"]
mtls-pem = ["dep:x509-parser", "dep:percent-encoding"]
otel = []
# Lightweight, tracing-only Sentry hook. No extra deps; consumers wire
# `sentry-tracing` themselves on the subscriber side if they want real
# Sentry capture.
sentry-tracing = []
# Real Sentry SDK integration. Per-RPC scopes, transactions, user
# enrichment from JWT claims, `capture_event` on errors. Pulls in the
# `sentry` crate. Coexists with `sentry-tracing` — different modules,
# different hooks; pick one (or both) for your deployment.
sentry-sdk = ["dep:sentry"]
shm = ["dep:libc", "dep:windows-sys"]
# Test fixtures (e.g. `external::InMemoryStorage`) exposed for
# downstream integration tests. Not for production use.
test-utils = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
trybuild = "1"
proptest = "1"

# Integration tests and examples that need a non-default feature must say so.
# Without `required-features` cargo builds every target under
# `--all-targets --no-default-features` and the build fails on missing items
# rather than skipping the target — which is the intended behaviour here.
# CI only ever runs --all-features, so these were invisible until the
# narrow-feature matrix was added.

# `external_integration` uses `InMemoryStorage`, gated on `test-utils` so it
# doesn't leak into the public crate surface, plus the `external` module itself.
[[test]]
name = "external_integration"
required-features = ["test-utils", "external"]

# axum/tower router tests: need the server stack.
[[test]]
name = "access_log_egress"
required-features = ["http"]

[[test]]
name = "http_auth"
required-features = ["http"]

[[test]]
name = "http_exchange_metadata"
required-features = ["http", "stream-codec"]

[[test]]
name = "http_init_metadata"
required-features = ["http"]

[[test]]
name = "http_introspect"
required-features = ["http"]

[[test]]
name = "http_load_balance"
required-features = ["http"]

[[test]]
name = "http_panic"
required-features = ["http"]

[[test]]
name = "http_protocol_version"
required-features = ["http"]

[[test]]
name = "http_polish"
required-features = ["http"]

# Derive-macro tests: need `macros` (and the router, where they serve).
[[test]]
name = "arrow_derive"
required-features = ["macros"]

[[test]]
name = "stream_state_derive"
required-features = ["macros", "stream-codec"]

[[test]]
name = "macro_async"
required-features = ["macros", "http"]

[[test]]
name = "macro_smoke"
required-features = ["macros", "http"]

# The trybuild harness itself compiles bare, but its UI fixtures use
# `vgi_rpc::service`, `#[derive(StreamState)]` and `vgi_rpc::stream_codec`.
# Without those the fixtures emit extra unresolved-item errors and the
# recorded .stderr files no longer match, so gate the target too.
[[test]]
name = "macro_compile_fail"
required-features = ["macros", "stream-codec"]

[[example]]
name = "hello_unary"
required-features = ["macros", "http"]

[[example]]
name = "hello_stream"
required-features = ["macros", "http"]

[[example]]
name = "load_balanced"
required-features = ["macros", "http"]

[dependencies]
flatbuffers = "25"
sha2.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
arrow-cast.workspace = true
bytes.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true

axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
jsonwebtoken = { version = "9.3", optional = true, default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
urlencoding = { version = "2", optional = true }
vgi-rpc-macros = { path = "../vgi-rpc-macros", version = "0.23.2", optional = true }
x509-parser = { version = "0.16", optional = true }
percent-encoding = { version = "2", optional = true }
libc = { version = "0.2", optional = true }
# Windows shared-memory backend (page-file-backed named CreateFileMapping) is
# declared target-gated below (Windows only). Keeping it out of the cross-platform
# [dependencies] means the `shm` feature no longer drags windows-sys onto wasm32
# targets (wasm32-unknown-emscripten / wasip1 / wasip2), where windows-sys 0.59
# mis-compiles (MEMORY_BASIC_INFORMATION on 32-bit non-Windows).
# Real Sentry SDK — gated by the `sentry-sdk` feature. Default
# features pull in tokio/reqwest transports; we strip them and let
# operators bring their own runtime. `backtrace` + `contexts` are the
# minimum surface needed for useful error events.
# sentry 0.47+ requires rustc 1.88, satisfied by the 1.97 workspace MSRV.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts"], optional = true }
chrono.workspace = true
rust_decimal.workspace = true

# Windows-only shared-memory backend for the `shm` feature. Target-gated so
# `shm = ["dep:libc", "dep:windows-sys"]` pulls windows-sys only on Windows;
# on unix/wasm the shm code uses the `#[cfg(unix)]` libc path instead.
# AF_UNIX socket-buffer tuning (see `unix::widen_socket_buffers`).  Unix only,
# and not optional: the default buffer is small enough to halve throughput, so
# a build that silently skipped it would be a performance trap.
[target.'cfg(unix)'.dependencies]
socket2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
