name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.86)
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --locked

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install vgi-rpc conformance harness
        # Pinned to a published version that includes the TestHealth +
        # cancel additions used by `test_rust_conformance.py`. Bump as
        # the upstream Python suite evolves.
        run: |
          python -m pip install --upgrade pip
          pip install "vgi-rpc[http,cli]>=0.9.0" pytest pytest-timeout httpx

      - name: Build conformance worker
        run: cargo build -p vgi-rpc-conformance-rust --locked

      - name: Symlink worker
        run: |
          ln -sf target/debug/vgi-rpc-conformance-rust conformance-worker-rust

      - name: Run conformance suite
        env:
          VGI_TRANSPORTS: pipe,subprocess,http,unix
          RUST_CONFORMANCE_WORKER: ${{ github.workspace }}/conformance-worker-rust
        run: |
          python -m pytest test_rust_conformance.py --timeout=10 --timeout-method=signal -v

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain (1.86)
        uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Build on MSRV
        run: cargo build --workspace --all-features --locked
