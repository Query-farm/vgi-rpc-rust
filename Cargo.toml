[workspace]
resolver = "2"
members = ["vgi-rpc", "vgi-rpc-macros", "vgi-rpc-client", "conformance-client-driver", "conformance-worker", "benchmark-worker", "vgi-rpc-s3", "vgi-rpc-gcs"]

[workspace.package]
version = "0.23.1"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Query Farm LLC <hello@query.farm>"]
homepage = "https://query.farm"
repository = "https://github.com/Query-farm/vgi-rpc-rust"

[workspace.dependencies]
arrow = { version = "59", default-features = false, features = ["ipc"] }
arrow-array = "59"
arrow-buffer = "59"
arrow-data = "59"
arrow-ipc = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-cast = "59"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["limit", "timeout", "catch-panic"] }
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
flate2 = "1"
bincode = "1.3"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false }
socket2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
