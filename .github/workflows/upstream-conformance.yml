name: Upstream Conformance

# Runs the Python `vgi-rpc-python` conformance suite against the Rust
# worker, pulling Python from the upstream repo's `main` (or a
# dispatched ref) instead of PyPI. Detects breakage as it lands
# upstream rather than only when the next wheel is published.
#
# Triggers:
#   schedule:           every 4 hours, in case the upstream webhook fails.
#   workflow_dispatch:  manual fire with an optional `upstream_ref` input.
#   repository_dispatch (event_type: upstream-changed):
#                       fired by the upstream repo on push-to-main; see
#                       the `dispatch-snippet` job at the bottom of this
#                       file for the YAML to drop into vgi-rpc-python.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "vgi-rpc-python git ref (branch/tag/SHA) to test against. Defaults to main."
        required: false
        default: "main"
  repository_dispatch:
    types: [upstream-changed]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve upstream ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.upstream_ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.ref || 'main' }}" >> $GITHUB_OUTPUT
          else
            echo "ref=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout vgi-rpc-rust
        uses: actions/checkout@v5

      - name: Checkout vgi-rpc-python (upstream)
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi-rpc-python
          ref: ${{ steps.ref.outputs.ref }}
          path: vgi-rpc-python

      - name: Resolve upstream commit SHA
        id: upstream
        run: |
          cd vgi-rpc-python
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "subject=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain (MSRV 1.86)
        uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install vgi-rpc-python from source + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./vgi-rpc-python[http,cli]"
          pip install pytest pytest-timeout httpx

      - name: Build conformance worker
        run: cargo build -p vgi-rpc-conformance-rust --locked

      - name: Symlink worker
        run: ln -sf target/debug/vgi-rpc-conformance-rust conformance-worker-rust

      - name: Run conformance suite
        id: conformance
        env:
          VGI_TRANSPORTS: pipe,subprocess,http,unix
          RUST_CONFORMANCE_WORKER: ${{ github.workspace }}/conformance-worker-rust
        run: |
          set +e
          python -m pytest test_rust_conformance.py \
            --timeout=10 --timeout-method=signal \
            --tb=short -q --no-header \
            > conformance.log 2>&1
          status=$?
          echo "status=$status" >> $GITHUB_OUTPUT
          tail -50 conformance.log
          # Capture failing test ids for the issue body.
          grep -E '^FAILED|^ERROR' conformance.log | head -50 > failing.txt || true
          exit $status

      - name: Tidy trybuild sandboxes before cache
        if: always()
        run: rm -rf target/tests

      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-log
          path: |
            conformance.log
            failing.txt

      - name: Open / update issue on conformance failure
        if: failure() && steps.conformance.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const upstreamSha   = '${{ steps.upstream.outputs.sha }}';
            const upstreamShort = '${{ steps.upstream.outputs.short }}';
            const upstreamSubj  = `${{ steps.upstream.outputs.subject }}`;
            let failing = '';
            try { failing = fs.readFileSync('failing.txt', 'utf8'); } catch (_) {}
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const title  = '[upstream-conformance] Rust worker failing against vgi-rpc-python main';
            const body = [
              `Conformance suite failed against upstream \`vgi-rpc-python\`:`,
              ``,
              `- Upstream commit: \`${upstreamShort}\` — ${upstreamSubj}`,
              `- Full SHA: \`${upstreamSha}\``,
              `- CI run: ${runUrl}`,
              ``,
              `### Failing tests`,
              '```',
              failing.trim() || '(see attached conformance.log)',
              '```',
              ``,
              `Triggered by: \`${context.eventName}\``,
              ``,
              `_This issue is updated automatically; close it once the suite is green again._`,
            ].join('\n');

            // Deduplicate: find any open issue with the same title.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'upstream-conformance',
              per_page: 50,
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.notice(`Updated existing issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title,
                body,
                labels: ['upstream-conformance', 'bug'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }

      - name: Close stale conformance issues on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[upstream-conformance] Rust worker failing against vgi-rpc-python main';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'upstream-conformance',
              per_page: 50,
            });
            for (const i of open.data) {
              if (i.title !== title) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: i.number,
                body: `Conformance back to green at upstream \`${{ steps.upstream.outputs.short }}\` — closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: i.number,
                state: 'closed',
              });
              core.notice(`Closed stale conformance issue #${i.number}`);
            }

  # ---------------------------------------------------------------------
  # Drop the following workflow into `vgi-rpc-python` so push-to-main
  # fires this suite immediately, rather than waiting for the schedule.
  # Add a `RUST_CONFORMANCE_DISPATCH` secret with a fine-grained PAT
  # holding `actions:write` on `Query-farm/vgi-rpc-rust`.
