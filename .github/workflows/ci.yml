name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features --locked

      # trybuild creates per-fixture `target/tests/<name>/` sandboxes
      # and tears them down before they finish. The rust-cache post
      # step walks `target/` to fingerprint cache contents and trips on
      # the half-cleaned-up dirs (`ENOENT: target/tests/target`).
      # Removing the parent directory before the post-cache step runs.
      - name: Tidy trybuild sandboxes before cache
        if: always()
        run: rm -rf target/tests

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Python client drives the Rust server — the original
          # cross-language wire-compat gate.
          - role: server
            server: rust
          # The Rust vgi-rpc-client drives the Rust server (conformance
          # client-driver + Python shim). Exercises the client across every
          # transport (incl. the POSIX shm side-channel) and the
          # external-location / sticky / 413-externalize / 415-codec /
          # response-cap HTTP feature paths.
          - role: client
            server: rust
          # The Rust client drives the canonical *Python* server — the
          # cross-language client gate. Uses the Python reference
          # serve_conformance_*.py scripts from the vgi-rpc-python repo
          # (storage / sticky / strict / auth), so the client's HTTP features
          # are validated against the reference implementation.
          - role: client
            server: python
    steps:
      - uses: actions/checkout@v5

      - name: Check out vgi-rpc-python (for the python server's serve scripts)
        if: matrix.server == 'python'
        uses: actions/checkout@v5
        with:
          repository: Query-farm/vgi-rpc-python
          path: vgi-python

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install conformance harness (PyPI pin for rust server; editable
          checkout for the python server so package + serve scripts match)
        # Pin the FLOOR to the release carrying the newest conformance group
        # this port implements, and raise it whenever one is added. A floor
        # that trails the suite resolves an older vgi-rpc where the new group
        # is *absent rather than skipped*, so CI goes green having never run
        # it. That is not hypothetical: 0.28.3 published at 16:45:17Z and this
        # step still resolved 0.28.2 at 16:46:45Z, because PyPI's index had
        # not propagated to pip yet. With an accurate floor that race fails
        # loudly instead of passing vacuously.
        # 0.28.3: TestProxyProof capability-header cases.
        # 0.29.0: TestSticky failure-path fixtures (expiry, wrong worker,
        #   cross-principal replay) — required now, not skippable.
        # 0.37.0: `vgi-rpc-test --require-request-data` and the validator fix
        #   that stopped rejecting zero-parameter calls. An older vgi-rpc has
        #   no such flag, so the access-log step below would either not parse
        #   or enforce nothing.
        # The `conformance` extra pulls jsonschema, which `vgi-rpc-test
        # --access-log` needs to check records against access_log.schema.json.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.server }}" = "python" ]; then
            pip install -e "./vgi-python[http,cli,external,conformance]" pytest pytest-timeout httpx
          else
            pip install "vgi-rpc[http,cli,external,conformance]>=0.37.0" pytest pytest-timeout httpx
          fi

      - name: Build conformance worker (+ client-driver for the client role)
        run: |
          if [ "${{ matrix.server }}" = "rust" ]; then
            cargo build -p vgi-rpc-conformance-rust --locked
            ln -sf target/debug/vgi-rpc-conformance-rust conformance-worker-rust
          fi
          if [ "${{ matrix.role }}" = "client" ]; then
            cargo build -p vgi-rpc-conformance-client-driver --locked
          fi

      - name: Run conformance suite (role=${{ matrix.role }}, server=${{ matrix.server }})
        # Full transport matrix — matches `scripts/conf.py run --transport all`.
        # `shm_pipe` exercises the POSIX shared-memory side-channel and
        # `http_externalize_always` the external-location upload/fetch path;
        # under role=client both flow through the Rust client.
        env:
          VGI_CONFORMANCE_ROLE: ${{ matrix.role }}
          VGI_CONFORMANCE_SERVER: ${{ matrix.server }}
          VGI_TRANSPORTS: pipe,subprocess,http,unix,http_externalize_always,shm_pipe
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/target/debug/vgi-rpc-conformance-client-driver
        run: |
          if [ "${{ matrix.server }}" = "python" ]; then
            export RUST_CONFORMANCE_WORKER="$(command -v vgi-rpc-conformance)"
            export VGI_PYTHON_BIN="$(command -v python)"
            export VGI_PY_TESTS_DIR="${{ github.workspace }}/vgi-python/tests"
          else
            export RUST_CONFORMANCE_WORKER="${{ github.workspace }}/conformance-worker-rust"
          fi
          python -m pytest test_rust_conformance.py --timeout=20 --timeout-method=signal -v

      # Access-log conformance was verified by hand for months and drifted
      # anyway — four people checked it by inspection and the rule was still
      # wrong. It runs here now so it cannot silently rot again.
      #
      # --access-log-debug is not optional: at INFO the worker omits
      # `request_data`, and a log that never carries the field trivially
      # satisfies every rule that governs it, so the whole payload contract
      # goes unchecked. --require-request-data makes that absence a failure.
      #
      # No --filter: the suite's zero-parameter methods (void*) send an empty
      # schema and no row, and they are the exact case a row-demanding
      # validator gets wrong (v0.36.1 shipped that bug). Do not add a filter
      # that excludes them.
      - name: Verify access log against the spec
        if: matrix.role == 'server' && matrix.server == 'rust'
        run: |
          timeout 120 vgi-rpc-test \
            --cmd "${{ github.workspace }}/conformance-worker-rust --access-log $RUNNER_TEMP/access-log.jsonl --access-log-debug" \
            --access-log "$RUNNER_TEMP/access-log.jsonl" \
            --require-request-data

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV toolchain (1.97)
        uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Build on MSRV
        run: cargo build --workspace --all-features --locked
