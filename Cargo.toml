[workspace]
resolver = "2"
members = ["vgi-rpc", "conformance-worker", "vgi-rpc-s3", "vgi-rpc-gcs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Query-farm/vgi-rpc-rust"

[workspace.dependencies]
arrow = { version = "58", default-features = false, features = ["ipc"] }
arrow-array = "58"
arrow-buffer = "58"
arrow-data = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-cast = "58"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
