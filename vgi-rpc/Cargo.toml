[package]
name = "vgi-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Transport-agnostic RPC framework built on Apache Arrow IPC"
readme = "README.md"
keywords = ["rpc", "arrow", "ipc", "streaming", "http"]
categories = ["network-programming", "web-programming::http-server", "data-structures"]

[features]
default = ["http", "macros"]
macros = ["dep:vgi-rpc-macros"]
# External-location batches (upload/resolve). Pulls only zstd — no server
# (axum/tokio) stack — so a client can reuse `external` without `http`.
external = ["dep:zstd"]
# Streaming-state bincode codec (serde + bincode only — no server stack). Used by
# the core dispatch path, so it must be enableable without `http` (keeps the crate
# wasm-buildable). `http` re-includes it.
stream-codec = ["dep:bincode"]
http = ["external", "stream-codec", "dep:axum", "dep:tower-http", "dep:tokio", "dep:hmac", "dep:base64", "dep:rand", "dep:bincode", "dep:chacha20poly1305"]
jwt = []
jwt-jsonwebtoken = ["jwt", "dep:jsonwebtoken", "dep:reqwest"]
oauth-pkce = []
oauth-pkce-server = ["oauth-pkce", "http", "dep:reqwest", "dep:urlencoding"]
mtls-pem = ["dep:x509-parser", "dep:percent-encoding"]
otel = []
# Lightweight, tracing-only Sentry hook. No extra deps; consumers wire
# `sentry-tracing` themselves on the subscriber side if they want real
# Sentry capture.
sentry-tracing = []
# Real Sentry SDK integration. Per-RPC scopes, transactions, user
# enrichment from JWT claims, `capture_event` on errors. Pulls in the
# `sentry` crate. Coexists with `sentry-tracing` — different modules,
# different hooks; pick one (or both) for your deployment.
sentry-sdk = ["dep:sentry"]
shm = ["dep:libc", "dep:windows-sys"]
# Test fixtures (e.g. `external::InMemoryStorage`) exposed for
# downstream integration tests. Not for production use.
test-utils = []

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber.workspace = true
trybuild = "1"
proptest = "1"

# `external_integration` uses `InMemoryStorage`, which is gated on
# `test-utils` so it doesn't leak into the public crate surface.
[[test]]
name = "external_integration"
required-features = ["test-utils"]

[dependencies]
flatbuffers = "25"
sha2.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
arrow-cast.workspace = true
bytes.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true

axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
jsonwebtoken = { version = "9.3", optional = true, default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
urlencoding = { version = "2", optional = true }
vgi-rpc-macros = { path = "../vgi-rpc-macros", version = "0.7.0", optional = true }
x509-parser = { version = "0.16", optional = true }
percent-encoding = { version = "2", optional = true }
libc = { version = "0.2", optional = true }
# Windows shared-memory backend (page-file-backed named CreateFileMapping).
# Only used on Windows under the `shm` feature; compiles to ~nothing elsewhere.
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
# Real Sentry SDK — gated by the `sentry-sdk` feature. Default
# features pull in tokio/reqwest transports; we strip them and let
# operators bring their own runtime. `backtrace` + `contexts` are the
# minimum surface needed for useful error events.
# sentry 0.47+ requires rustc 1.88, satisfied by the 1.90 workspace MSRV.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts"], optional = true }
chrono.workspace = true
rust_decimal.workspace = true
