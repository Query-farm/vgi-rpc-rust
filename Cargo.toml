[workspace]
resolver = "2"
members = ["vgi-rpc", "vgi-rpc-macros", "conformance-worker", "vgi-rpc-s3", "vgi-rpc-gcs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/Query-farm/vgi-rpc-rust"

[workspace.dependencies]
arrow = { version = "58", default-features = false, features = ["ipc"] }
arrow-array = "58"
arrow-buffer = "58"
arrow-data = "58"
arrow-ipc = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-cast = "58"
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
bincode = "1.3"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false }

[patch.crates-io]
arrow-array = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-buffer = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-data = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-ipc = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-schema = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-select = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }
arrow-cast = { git = "https://github.com/rustyconover/arrow-rs.git", branch = "feat/custom-metadata-and-buffer-reader" }

[profile.release]
opt-level = 3
lto = "thin"
