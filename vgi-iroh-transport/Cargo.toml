[package]
name = "vgi-iroh-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Arrow-free native Iroh transport core for VGI clients"
readme = "README.md"

[dependencies]
bytes.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
futures-util = "0.3"
iroh-http-core = { package = "query-farm-iroh-http-core", version = "0.6.3" }
tower = { version = "0.5", features = ["util"] }
