name: Release

# Publish the workspace's published crates to crates.io in dependency
# order when a `v*` tag is pushed.  Uses crates.io Trusted Publishing
# (OIDC) — no long-lived `CARGO_REGISTRY_TOKEN` secret required.
#
# Setup checklist (one-time):
#   1. Register each crate on crates.io as a Trusted Publisher
#      bound to this repo + this workflow file + the `crates-io`
#      environment below. Every crate in the publish loop needs its own entry.
#   2. Create a GitHub Environment named `crates-io` (Settings →
#      Environments). The environment is part of the OIDC trust boundary;
#      reviewer protection is optional and is not required by this project.
#
# Release flow:
#   1. Bump the workspace version in the root `Cargo.toml`.
#   2. Update `CHANGELOG.md`.
#   3. `git tag v0.1.0 && git push origin v0.1.0`.
#   4. The GitHub Release is cut automatically from the CHANGELOG section
# for that version — see the final step.  Unlike the sibling SDK repos,
# which publish *in response to* a published Release, this repo publishes
# on tag push, so nothing else would ever create one.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Manual dispatch validates packaging and cargo-publish inputs without
  # publishing crates or creating a GitHub Release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Manual runs are always dry-run; this input is retained for clarity."
        type: boolean
        default: true

# Default every job to read-only repository access. Crate publishing and
# GitHub Release creation elevate only their own narrow jobs below.
permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate tag and workspace version
        id: metadata
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="vgi-iroh-cabi") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          fi

  cabi-artifacts:
    name: C ABI (${{ matrix.target }})
    needs: release-metadata
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: iroh-cabi-${{ matrix.target }}

      - name: Build native C ABI
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --locked --release --target "${{ matrix.target }}" -p vgi-iroh-cabi

      - name: Package relocatable C ABI
        shell: bash
        run: |
          scripts/package-iroh-cabi.sh \
            "${{ matrix.target }}" "${{ needs.release-metadata.outputs.version }}" \
            "$GITHUB_SHA" target release-assets

      - name: Compile, link, and run staged archive smoke test
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-metadata.outputs.version }}"
          package="vgi-iroh-cabi-v${version}-${{ matrix.target }}"
          mkdir -p staged
          tar -xzf "release-assets/${package}.tar.gz" -C staged
          cmake -S vgi-iroh-cabi/smoke -B smoke-build \
            -DCMAKE_PREFIX_PATH="$PWD/staged/$package"
          cmake --build smoke-build --config Release
          ctest --test-dir smoke-build --build-config Release --output-on-failure

      - name: Upload C ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgi-iroh-cabi-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: release-metadata
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Sanity gate — fmt, clippy, test, conformance run (best-effort)
        # The full CI already validates these on every push to main;
        # this step re-runs the cheap subset on the tagged commit so
        # we don't publish bytes that differ from what CI validated.
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Authenticate to crates.io via OIDC
        if: github.event_name == 'push'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Crates publish in dependency order; each `cargo publish` does
      # its own verification build against the freshly-uploaded prior
      # crate.  We sleep a short interval between publications to let
      # the crates.io index propagate so the next crate's verify
      # build can resolve the dep.

      # Publish every crate in dependency order. Idempotent: a version already
      # on crates.io is skipped, so a re-run after a partial failure (e.g. a
      # missing per-crate Trusted Publisher) publishes only what's left instead
      # of erroring on the already-uploaded ones. Each real publish runs its own
      # verify build against the freshly-uploaded prior crate, so we sleep to let
      # the crates.io index propagate before the next one resolves it.
      - name: Publish crates (dependency order, idempotent)
        run: |
          set -euo pipefail
          DRY_RUN=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then DRY_RUN=false; fi
          UA="vgi-rpc-release (hello@query.farm)"
          dry_run_patches=(
            --config 'patch.crates-io.vgi-rpc-macros.path="vgi-rpc-macros"'
            --config 'patch.crates-io.vgi-rpc.path="vgi-rpc"'
            --config 'patch.crates-io.vgi-iroh-transport.path="vgi-iroh-transport"'
            --config 'patch.crates-io.vgi-rpc-client.path="vgi-rpc-client"'
          )
          for crate in vgi-rpc-macros vgi-rpc vgi-iroh-transport vgi-rpc-client vgi-rpc-iroh vgi-rpc-iroh-browser vgi-iroh-cabi vgi-rpc-s3 vgi-rpc-gcs; do
            ver=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            if [ "$DRY_RUN" = "true" ]; then
              echo "::group::dry-run $crate $ver"
              # Dry-run never uploads earlier workspace crates. Patch their
              # crates.io identities back to this checkout so later packages
              # receive the same verification build as a real ordered publish.
              cargo publish --dry-run -p "$crate" --locked "${dry_run_patches[@]}"
              echo "::endgroup::"
              continue
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: $UA" \
              "https://crates.io/api/v1/crates/$crate/$ver")
            if [ "$code" = "200" ]; then
              echo "$crate $ver already on crates.io — skipping"
              continue
            fi
            echo "Publishing $crate $ver"
            cargo publish -p "$crate" --locked
            echo "Waiting 30s for crates.io index propagation..."
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Prune transient test build artifacts before cache save
        # The sanity gate's `cargo test` runs the trybuild compile-fail
        # cases, which leave scratch build dirs under `target/tests` — on
        # Linux runners with a dangling `target/tests/target` symlink. The
        # `Swatinem/rust-cache` post-step walks `target/` to save the cache
        # and aborts on that broken symlink with `ENOENT: opendir`. Remove
        # the scratch (and any other broken symlinks) so the save completes
        # cleanly. Runs regardless of publish outcome.
        if: always()
        run: |
          rm -rf target/tests
          find target -xtype l -delete 2>/dev/null || true

      - name: Summarise
        if: success()
        run: |
          echo "Validated release ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}"
          echo "Crates: vgi-rpc-macros, vgi-rpc, vgi-iroh-transport, vgi-rpc-client, vgi-rpc-iroh, vgi-rpc-iroh-browser, vgi-iroh-cabi, vgi-rpc-s3, vgi-rpc-gcs"

  release-assets:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-metadata, cabi-artifacts, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download native C ABI release assets
        uses: actions/download-artifact@v5
        with:
          pattern: vgi-iroh-cabi-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and attach native C ABI assets
        # This repo publishes on *tag push*, whereas the sibling SDK repos
        # publish in response to a *published Release* — so there, a Release
        # necessarily exists. Here nothing created one, and the repo sat
        # advertising v0.8.0 as "latest" while crates.io had shipped seven
        # versions past it, with a maintained CHANGELOG nobody could see.
        # Idempotent so a re-run after a partial publish doesn't error.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Extract just this version's section from CHANGELOG.md.
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "No CHANGELOG section for $VER; falling back to a pointer."
            echo "See CHANGELOG.md for details." > /tmp/release-notes.md
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > /tmp/current-release.json
          for asset in release-assets/*; do
            asset_name=$(basename "$asset")
            local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
            if jq -e --arg name "$asset_name" \
                '.assets[] | select(.name == $name)' \
                /tmp/current-release.json >/dev/null; then
              remote_digest=$(jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .digest // empty' \
                /tmp/current-release.json)
              if [ "$remote_digest" != "$local_digest" ]; then
                echo "refusing to replace $asset_name: remote $remote_digest, local $local_digest" >&2
                exit 1
              fi
              echo "$asset_name already exists with the expected digest — skipping"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done
