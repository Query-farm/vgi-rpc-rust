[package]
name = "vgi-iroh-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Narrow Iroh ingress bridge for VGI RPC workers"
publish = false

[dependencies]
anyhow = "1"
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
iroh-http-core = { git = "https://github.com/Query-farm/iroh-http.git", rev = "4bb79cc9289d48ff21e2e4f52f0ba66d27cb60a9", package = "iroh-http-core" }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tracing.workspace = true
tracing-subscriber.workspace = true
vgi-rpc-iroh = { path = "../vgi-rpc-iroh" }

[dev-dependencies]
