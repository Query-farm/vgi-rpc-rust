[package]
name = "vgi-rpc-iroh-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Browser-capable client-side HTTP over a shared Iroh endpoint"
readme = "README.md"
keywords = ["rpc", "iroh", "http", "wasm", "browser"]
categories = ["network-programming", "wasm", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
iroh-http-core = "=0.6.2"
tower = { version = "0.5", features = ["util"] }
