[package]
name = "vgi-rpc-iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Stateful authenticated Iroh transport for vgi-rpc"
readme = "README.md"
keywords = ["rpc", "arrow", "iroh", "quic", "p2p"]
categories = ["network-programming"]

[dependencies]
vgi-rpc = { path = "../vgi-rpc", version = "0.24.0", default-features = false }
vgi-rpc-client = { path = "../vgi-rpc-client", version = "0.24.0", default-features = false }
vgi-iroh-transport = { path = "../vgi-iroh-transport", version = "0.24.0" }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io", "rt"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
