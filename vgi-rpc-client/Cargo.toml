[package]
name = "vgi-rpc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Blocking client for the vgi-rpc Arrow-IPC RPC framework"
readme = "README.md"
keywords = ["rpc", "arrow", "ipc", "streaming", "client"]
categories = ["network-programming", "web-programming::http-client", "data-structures"]

[features]
default = ["http"]
# HTTP transport (reqwest blocking + zstd/gzip codec negotiation + external-location
# resolve/upload via vgi-rpc's external module).
http = ["dep:reqwest", "dep:zstd", "dep:flate2", "dep:base64", "dep:sha2", "vgi-rpc/external"]
# Native authenticated HTTP/1.1 exchanges carried over Iroh's `iroh-http/2`
# ALPN. This extends the blocking HTTP client without adding Iroh to default
# builds.
iroh = ["http", "dep:vgi-iroh-transport", "dep:tokio"]
# AF_UNIX socket transport. Compiles to a no-op on non-unix targets.
unix = []
# POSIX shared-memory side-channel. Reuses vgi-rpc's shm module.
shm = ["vgi-rpc/shm"]

[dependencies]
vgi-rpc = { path = "../vgi-rpc", version = "0.24.2", default-features = false }
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
bytes.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
zstd = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
vgi-iroh-transport = { path = "../vgi-iroh-transport", version = "0.24.2", optional = true }
tokio = { workspace = true, optional = true }

# See `vgi_rpc::unix::widen_socket_buffers` — the client half of the same fix.
[target.'cfg(unix)'.dependencies]
socket2.workspace = true
libc = "0.2"

[dev-dependencies]
arrow-cast.workspace = true
# Spin up a real axum HTTP server in-process for round-trip tests.
vgi-rpc = { path = "../vgi-rpc", version = "0.24.2", features = ["http"] }
tokio = { workspace = true }
axum = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
iroh-http-core = { git = "https://github.com/Query-farm/iroh-http.git", rev = "fe64a5512fc711a016033daa02ed487555023518" }
tower = { version = "0.5", features = ["util"] }
